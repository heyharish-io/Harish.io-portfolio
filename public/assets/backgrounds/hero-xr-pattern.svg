<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <!-- XR-themed Hero Background Pattern - Subtle grid with depth -->
  <defs>
    <linearGradient id="gridLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.08"/>
      <stop offset="70%" style="stop-color:#3b82f6;stop-opacity:0.02"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="url(#gridLine)" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="url(#gridLine)" stroke-width="0.5"/>
    </pattern>
    <pattern id="dotPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#3b82f6" opacity="0.12"/>
    </pattern>
  </defs>
  <!-- Base dark background -->
  <rect width="1200" height="800" fill="#0a0b10"/>
  <!-- Subtle perspective grid floor -->
  <g transform="translate(600, 550) rotateX(75deg) scale(1.5, 0.8)" opacity="0.15">
    <rect x="-600" y="-400" width="1200" height="800" fill="url(#gridPattern)"/>
  </g>
  <!-- Subtle dot grid overlay -->
  <rect width="1200" height="800" fill="url(#dotPattern)" opacity="0.4"/>
  <!-- Center radial glow -->
  <ellipse cx="600" cy="350" rx="400" ry="200" fill="url(#centerGlow)"/>
  <!-- Floating geometric accents (XR tracking markers) -->
  <g opacity="0.08">
    <!-- Top left marker -->
    <g transform="translate(120, 150)">
      <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="-5" y="-5" width="10" height="10" fill="#3b82f6"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#3b82f6" stroke-width="0.5"/>
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#3b82f6" stroke-width="0.5"/>
    </g>
    <!-- Top right marker -->
    <g transform="translate(1080, 180)">
      <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="#60a5fa" stroke-width="1"/>
      <circle cx="0" cy="0" r="4" fill="#60a5fa"/>
    </g>
    <!-- Bottom left marker -->
    <g transform="translate(150, 650)">
      <polygon points="0,-12 10,6 -10,6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#3b82f6"/>
    </g>
    <!-- Bottom right marker -->
    <g transform="translate(1050, 620)">
      <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#60a5fa" stroke-width="1" transform="rotate(45)"/>
      <circle cx="0" cy="0" r="3" fill="#60a5fa"/>
    </g>
    <!-- Center floating cube wireframe (subtle) -->
    <g transform="translate(600, 350) scale(0.6)" opacity="0.06">
      <rect x="-50" y="-50" width="100" height="100" fill="none" stroke="#3b82f6" stroke-width="1"/>
      <rect x="-30" y="-30" width="60" height="60" fill="none" stroke="#60a5fa" stroke-width="0.5"/>
      <line x1="-50" y1="-50" x2="-30" y2="-30" stroke="#3b82f6" stroke-width="0.5"/>
      <line x1="50" y1="-50" x2="30" y2="-30" stroke="#3b82f6" stroke-width="0.5"/>
      <line x1="-50" y1="50" x2="-30" y2="30" stroke="#3b82f6" stroke-width="0.5"/>
      <line x1="50" y1="50" x2="30" y2="30" stroke="#3b82f6" stroke-width="0.5"/>
    </g>
  </g>
  <!-- Scan line effect -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#3b82f6" stroke-width="0.5"/>
    <line x1="0" y1="700" x2="1200" y2="700" stroke="#3b82f6" stroke-width="0.5"/>
  </g>
</svg>