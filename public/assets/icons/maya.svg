<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Maya Logo - Green/Teal theme (Autodesk Maya) -->
  <defs>
    <linearGradient id="mayaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#00a085"/>
    </linearGradient>
    <linearGradient id="mayaDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1f1a"/>
      <stop offset="100%" style="stop-color:#05100d"/>
    </linearGradient>
  </defs>
  <!-- Rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="20" fill="url(#mayaDark)" stroke="url(#mayaGrad)" stroke-width="2"/>
  <!-- Maya "M" symbol - three peaks representing 3D -->
  <path d="M38 88 L46 48 L54 72 L62 48 L70 88" fill="none" stroke="url(#mayaGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Subtle grid lines in background -->
  <g stroke="url(#mayaGrad)" stroke-width="0.5" opacity="0.15">
    <line x1="24" y1="30" x2="104" y2="30"/>
    <line x1="24" y1="50" x2="104" y2="50"/>
    <line x1="24" y1="70" x2="104" y2="70"/>
    <line x1="24" y1="90" x2="104" y2="90"/>
    <line x1="30" y1="18" x2="30" y2="110"/>
    <line x1="50" y1="18" x2="50" y2="110"/>
    <line x1="70" y1="18" x2="70" y2="110"/>
    <line x1="90" y1="18" x2="90" y2="110"/>
  </g>
</svg>