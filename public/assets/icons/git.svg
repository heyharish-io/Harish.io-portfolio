<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Git Logo - Official orange/red -->
  <defs>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f05032"/>
      <stop offset="100%" style="stop-color:#e04022"/>
    </linearGradient>
    <linearGradient id="gitWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="64" cy="64" r="56" fill="url(#gitGrad)"/>
  <!-- Git symbol - three circles with connectors -->
  <g fill="url(#gitWhite)">
    <!-- Top left circle -->
    <circle cx="36" cy="36" r="14"/>
    <!-- Top right circle -->
    <circle cx="92" cy="36" r="14"/>
    <!-- Bottom center circle -->
    <circle cx="64" cy="92" r="14"/>
  </g>
  <!-- Connecting lines -->
  <path d="M36 50 L64 78 L92 50" fill="none" stroke="url(#gitWhite)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 36 L64 50 L78 36" fill="none" stroke="url(#gitWhite)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow heads on connectors -->
  <polygon points="64,78 58,66 70,66" fill="url(#gitWhite)"/>
  <polygon points="64,50 58,62 70,62" fill="url(#gitWhite)"/>
</svg>