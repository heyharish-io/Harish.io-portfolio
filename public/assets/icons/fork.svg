<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Fork Git Client Logo -->
  <defs>
    <linearGradient id="forkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ac7f5"/>
      <stop offset="100%" stop-color="#1f98d4"/>
    </linearGradient>
    <linearGradient id="forkHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="64" cy="64" r="54"/>
    </clipPath>
    <filter id="forkShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#034870" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Dark Ring -->
  <circle cx="64" cy="64" r="57" fill="#151b26"/>

  <!-- Inner Vibrant Blue Badge -->
  <circle cx="64" cy="64" r="54" fill="url(#forkBg)"/>

  <!-- Subtle Top Highlight Arch -->
  <path d="M14 56 C18 30 38 14 64 14 C90 14 110 30 114 56 C98 38 78 30 64 30 C50 30 30 38 14 56 Z" fill="url(#forkHighlight)"/>

  <!-- Fork Silhouette clipped to circle -->
  <g clip-path="url(#circleClip)">
    <!-- Fork Shape with Soft Drop Shadow & Clean Stroke -->
    <path d="
      M 57.5 120
      L 57.5 76
      C 57.5 68 44 65 44 52
      L 44 25
      A 2.75 2.75 0 0 1 49.5 25
      L 49.5 50
      A 3 3 0 0 0 55.5 50
      L 55.5 25
      A 2.75 2.75 0 0 1 61 25
      L 61 50
      A 3 3 0 0 0 67 50
      L 67 25
      A 2.75 2.75 0 0 1 72.5 25
      L 72.5 50
      A 3 3 0 0 0 78.5 50
      L 78.5 25
      A 2.75 2.75 0 0 1 84 25
      L 84 52
      C 84 65 70.5 68 70.5 76
      L 70.5 120
      Z"
      fill="#ffffff"
      stroke="#151b26"
      stroke-width="2.75"
      stroke-linejoin="round"
      stroke-linecap="round"
      filter="url(#forkShadow)"
    />
  </g>

  <!-- Rim Border Outline for crispness -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#151b26" stroke-width="4.5"/>
</svg>